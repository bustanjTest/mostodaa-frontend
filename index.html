<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<!-- سياسة أمان المحتوى: تمنع الاتصال بأي سيرفر غير الـ API الخاص بنا (يحدّ من سرقة التوكن لو صار XSS).
     ملاحظة: لو غيّرت عنوان الـ API (دومين مخصص مثلاً) لازم تعدّل connect-src هون وعنوان API_BASE بالسكربت. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://mostodaa-backend-3d1m.onrender.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>مستودع مسروجي · نظام العمولات (متصل بالسيرفر)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5FAF7;
    --surface:#FFFFFF;
    --ink:#12302B;
    --ink-soft:#5B7570;
    --primary:#0F5D52;
    --primary-dark:#0A423A;
    --primary-tint:#E4F1EC;
    --accent:#C89B3C;
    --accent-tint:#FBF1DB;
    --danger:#C0392B;
    --border:#DCE8E3;
    --radius:16px;
    --shadow:0 10px 30px -14px rgba(15,93,82,.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 500px at 100% -10%, #DDEFE6 0%, transparent 60%),
      radial-gradient(700px 400px at -10% 110%, #F3E9CC 0%, transparent 55%),
      var(--bg);
    min-height:100vh;
    font-family:'Tajawal',sans-serif;
    color:var(--ink);
  }
  h1,h2,h3,.display{font-family:'Cairo',sans-serif;}
  .num{font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- shared layout ---------- */
  .center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 18px;}
  .card{
    width:100%;max-width:400px;background:var(--surface);
    border-radius:22px;padding:30px 26px;box-shadow:var(--shadow);
    border:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .brand-mark{
    width:46px;height:46px;border-radius:13px;flex:none;
    background:linear-gradient(155deg,var(--primary),var(--primary-dark));
    display:flex;align-items:center;justify-content:center;
    color:var(--accent-tint);font-family:'Cairo';font-weight:800;font-size:20px;
    box-shadow:0 6px 16px -6px rgba(10,66,58,.55);
  }
  .brand-text .t1{font-family:'Cairo';font-weight:800;font-size:18px;line-height:1.1;color:var(--primary-dark);}
  .brand-text .t2{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
  input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],select,textarea{
    width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid var(--border);
    font-family:'Tajawal';font-size:15px;background:#FCFEFD;color:var(--ink);
    outline:none;transition:border-color .15s, box-shadow .15s;
  }
  textarea{resize:vertical;}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
  input.err{border-color:var(--danger);}
  .row2{display:flex;gap:10px;}
  .row2>*{flex:1;}
  .row3{display:flex;gap:10px;}
  .row3>*{flex:1;}

  button{font-family:'Tajawal';cursor:pointer;border:none;outline:none;}
  .btn{
    width:100%;padding:13px 14px;border-radius:12px;font-weight:700;font-size:15px;
    background:var(--primary);color:#fff;transition:transform .12s, background .15s, opacity .15s;
  }
  .btn:hover{background:var(--primary-dark);}
  .btn:active{transform:scale(.98);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
  .btn.ghost:hover{background:var(--primary-tint);}
  .btn.accent{background:var(--accent);color:#3A2C08;}
  .btn.accent:hover{background:#B78A2E;}
  .btn.sm{padding:9px 12px;font-size:13px;border-radius:9px;width:auto;}
  .btn.danger{background:#FBE7E4;color:var(--danger);}
  .link-btn{background:none;border:none;color:var(--primary);font-weight:700;font-size:13.5px;padding:0;}

  .divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--ink-soft);font-size:12px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

  .back-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .back-row button{background:none;color:var(--ink-soft);font-size:13px;font-weight:700;padding:4px 0;}

  .otp-banner{
    background:var(--accent-tint);border:1px dashed #D8B564;border-radius:11px;
    padding:11px 12px;font-size:13.5px;color:#7A5A16;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .otp-banner .code{font-family:'IBM Plex Mono';font-weight:600;font-size:16px;letter-spacing:3px;}

  .badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .badge.ok{background:#E1F3EA;color:#1D7A4C;}
  .badge.pending{background:#FBF1DB;color:#8A6512;}
  .badge.rejected{background:#FBE4E1;color:#A3352A;}

  .toast-wrap{position:fixed;top:16px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:999;pointer-events:none;}
  .toast{
    background:var(--primary-dark);color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;
    box-shadow:0 8px 22px -8px rgba(0,0,0,.4);animation:toastIn .25s ease-out;
  }
  .toast.danger{background:#7A2A21;}
  @keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- ticket / receipt signature ---------- */
  .ticket{
    position:relative;background:var(--surface);border:1px solid var(--border);
    border-radius:14px 14px 0 0;padding:18px 18px 26px 18px;margin-bottom:22px;
    box-shadow:0 8px 20px -12px rgba(15,93,82,.25);
  }
  .ticket::after{
    content:'';position:absolute;left:0;right:0;bottom:-11px;height:11px;
    background:
      linear-gradient(-45deg, var(--bg) 6px, transparent 0) 0 0/12px 12px repeat-x,
      linear-gradient(45deg, var(--bg) 6px, transparent 0) 0 0/12px 12px repeat-x;
  }

  /* ---------- app shell ---------- */
  .app-header{
    background:linear-gradient(155deg,var(--primary),var(--primary-dark));color:#fff;
    padding:18px 20px 22px;border-radius:0 0 20px 20px;
  }
  .app-header-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .app-header .pharmacy{font-family:'Cairo';font-weight:800;font-size:17px;}
  .app-header .sub{font-size:12px;opacity:.85;margin-top:2px;}
  .app-header .logout{background:rgba(255,255,255,.15);color:#fff;font-size:12px;padding:7px 12px;border-radius:9px;font-weight:700;}
  .app-header .logout:hover{background:rgba(255,255,255,.28);}

  .app-body{flex:1;padding:18px 16px 90px;max-width:520px;margin:0 auto;width:100%;}
  .app-body.wide{max-width:1000px;}
  .app-body.noTabbar{padding-bottom:24px;}

  .tabbar{
    position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
    display:flex;max-width:520px;margin:0 auto;box-shadow:0 -8px 20px -14px rgba(0,0,0,.15);
  }
  .tabbar.wide{max-width:1000px;}
  .tabbar button{
    flex:1;background:none;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);font-size:10.5px;font-weight:700;
  }
  .tabbar button .ic{font-size:18px;}
  .tabbar button.active{color:var(--primary);}
  .tabbar-fixed-wrap{max-width:520px;margin:0 auto;width:100%;position:fixed;bottom:0;left:0;right:0;}
  .tabbar-fixed-wrap.wide{max-width:1000px;}

  .section-title{font-family:'Cairo';font-weight:800;font-size:16.5px;margin:2px 0 14px;color:var(--primary-dark);}

  .step-block{margin-bottom:18px;}
  .step-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .step-num{
    width:20px;height:20px;border-radius:50%;background:var(--primary-tint);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none;
  }
  .step-done .step-num{background:var(--primary);color:#fff;}

  select.cat-select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%230F5D52' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:14px center;padding-left:34px;}

  .commission-hero{
    text-align:center;padding:14px 6px 8px;
  }
  .commission-hero .lbl{font-size:13px;color:var(--ink-soft);font-weight:700;}
  .commission-hero .amt{font-family:'Cairo';font-weight:800;font-size:34px;color:var(--accent);margin:6px 0 2px;}
  .commission-hero .amt .cur{font-size:16px;color:var(--ink-soft);font-weight:700;margin-right:6px;}

  .history-summary{
    background:linear-gradient(155deg,var(--primary),var(--primary-dark));color:#fff;
    border-radius:16px;padding:18px 20px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;
  }
  .history-summary .lbl{font-size:12px;opacity:.85;}
  .history-summary .val{font-family:'Cairo';font-weight:800;font-size:26px;margin-top:3px;}
  .history-summary .cnt{text-align:left;font-size:12px;opacity:.9;}
  .history-summary .cnt b{font-family:'IBM Plex Mono';font-size:16px;display:block;}

  .sale-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .sale-row .cat{font-weight:700;font-size:14.5px;}
  .sale-row .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .sale-row .commission{font-family:'IBM Plex Mono';font-weight:600;color:var(--accent);font-size:15px;white-space:nowrap;}
  .thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer;}

  .sale-actions{display:flex;gap:8px;margin-top:10px;}
  .sale-actions button{flex:1;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .ic{font-size:36px;margin-bottom:10px;}
  .empty-state .t{font-weight:700;color:var(--ink);margin-bottom:4px;}
  .empty-state .d{font-size:13px;}

  .cat-mgmt-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;}
  .cat-mgmt-row .n{font-weight:700;font-size:14.5px;}
  .cat-mgmt-row .p{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .file-drop{
    border:1.5px dashed var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;
    background:#FCFEFD;transition:border-color .15s;
  }
  .file-drop:hover{border-color:var(--primary);}
  .file-drop .ic{font-size:22px;}
  .file-drop .t{font-size:13px;font-weight:700;margin-top:4px;}
  .preview-img{max-width:100%;max-height:150px;border-radius:10px;margin-top:10px;}

  ::placeholder{color:#A9BDB8;}
  @media (max-width:380px){.card{padding:24px 18px;}}

  /* ---------- admin dashboard ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
  .stat-grid.one{grid-template-columns:1fr;}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:13px 10px;text-align:center;}
  .stat-card .v{font-family:'Cairo';font-weight:800;font-size:19px;color:var(--primary-dark);}
  .stat-card .l{font-size:11px;color:var(--ink-soft);margin-top:3px;font-weight:600;}
  .admin-section{margin-bottom:30px;}
  .admin-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:13px;background:#fff;}
  table.data-table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap;}
  table.data-table th{background:var(--primary-tint);color:var(--primary-dark);font-family:'Cairo';font-weight:700;padding:10px 12px;text-align:right;position:sticky;top:0;}
  table.data-table td{padding:9px 12px;border-top:1px solid var(--border);color:var(--ink);}
  table.data-table td.num,table.data-table th.num{font-family:'IBM Plex Mono';}
  table.data-table tr:hover td{background:#FAFDFB;}
  .export-btn{display:inline-flex;align-items:center;gap:6px;background:#1D6F3E;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;}
  .export-btn:hover{background:#175A32;}

  /* ---------- قائمة مراجعة الفواتير ---------- */
  .review-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  .review-top{display:flex;gap:12px;align-items:flex-start;}
  .review-thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;border:1px solid var(--border);flex:none;cursor:pointer;transition:transform .12s;}
  .review-thumb:hover{transform:scale(1.05);}
  .review-info .n{font-weight:700;font-size:14.5px;}
  .review-info .m{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.6;}
  .review-actions{display:flex;gap:8px;margin-top:12px;}
  .review-actions button{flex:1;}
  .btn.approve{background:#1D7A4C;color:#fff;}
  .btn.approve:hover{background:#166139;}
  .dup-warning{color:var(--danger);font-size:11.5px;font-weight:700;margin-top:8px;}

  .lb-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:13px;margin-bottom:9px;}
  .lb-row.me{border-color:var(--accent);background:var(--accent-tint);}
  .lb-rank{width:30px;height:30px;border-radius:50%;background:var(--primary-tint);color:var(--primary-dark);
    display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:800;font-size:13px;flex:none;}
  .lb-rank.gold{background:#F5D48A;color:#7A5A16;}
  .lb-rank.silver{background:#DCE3E6;color:#4C5A5F;}
  .lb-rank.bronze{background:#E9C4A0;color:#6B4321;}
  .lb-name{flex:1;}
  .lb-name .n{font-weight:700;font-size:14px;}
  .lb-name .c{font-size:11.5px;color:var(--ink-soft);}
  .lb-amt{font-family:'IBM Plex Mono';font-weight:700;color:var(--accent);font-size:14.5px;}

  /* ---------- image viewer modal ---------- */
  .img-modal-overlay{
    position:fixed;inset:0;background:rgba(10,26,22,.9);z-index:1000;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px;
  }
  .img-modal-overlay.hidden{display:none;}
  .img-modal-inner{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:100%;}
  .img-modal-img{max-width:92vw;max-height:72vh;border-radius:12px;box-shadow:0 24px 60px -12px rgba(0,0,0,.6);background:#fff;}
  .img-modal-actions{display:flex;gap:10px;}
  .img-modal-actions a,.img-modal-actions button{padding:11px 20px;border-radius:11px;font-weight:700;font-size:13.5px;font-family:'Tajawal';border:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .img-modal-download{background:var(--accent);color:#3A2C08;}
  .img-modal-download:hover{background:#B78A2E;}
  .img-modal-close{background:rgba(255,255,255,.16);color:#fff;}
  .img-modal-close:hover{background:rgba(255,255,255,.28);}
  .view-invoice-btn{background:var(--primary-tint);color:var(--primary-dark);padding:6px 11px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap;}
  .view-invoice-btn:hover{background:#D3E9E0;}

  /* ---------- charts ---------- */
  .chart-block{margin-bottom:22px;}
  .chart-title{font-weight:700;font-size:13.5px;margin-bottom:10px;color:var(--ink);}
  .chart-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .chart-label{width:120px;flex:none;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chart-bar-track{flex:1;background:var(--primary-tint);border-radius:8px;height:16px;overflow:hidden;}
  .chart-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:8px;}
  .chart-val{width:72px;flex:none;text-align:left;font-size:12px;font-weight:700;color:var(--ink);}

  /* ---------- sub-admin management ---------- */
  .subadmin-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;}
  .subadmin-row .n{font-weight:700;font-size:14px;}
  .subadmin-row .p{font-size:12px;color:var(--ink-soft);margin-top:2px;}
</style>
</head>
<body>
<div id="toastWrap" class="toast-wrap"></div>
<div id="app"></div>
<div id="connBanner" style="display:none;position:fixed;top:0;left:0;right:0;background:#7A2A21;color:#fff;text-align:center;font-size:12.5px;padding:7px 10px;z-index:1500;font-weight:700;"></div>

<div id="imgModal" class="img-modal-overlay hidden" onclick="closeImageModal()">
  <div class="img-modal-inner" onclick="event.stopPropagation()">
    <img id="imgModalImg" class="img-modal-img" src="" alt="صورة الفاتورة">
    <div class="img-modal-actions">
      <a id="imgModalDownload" class="img-modal-download" href="#" download="فاتورة.jpg">⬇ تحميل الصورة</a>
      <button class="img-modal-close" onclick="closeImageModal()">✕ إغلاق</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* =========================================================
   نظام عمولات مستودع مسروجي — واجهة متصلة بالباك-إند الحقيقي

   - النظام مقسم لقسمين: أدوية (MEDICINE) وكوزمتك (COSMETICS).
   - الصيدلي حساب واحد يقدر يبيع بالقسمين، ويختار القسم بعد الدخول
     (شاشة deptChoice) قبل ما يوصل لصفحة إضافة عملية بيع، ويقدر
     يبدّل القسم بأي وقت من زر بأعلى الشاشة.
   - نوع أدمن واحد بصلاحيات كاملة: بعد الدخول بيختار "لوحة الأدوية" أو
     "لوحة الكوزمتك"، وبيقدر يبدّل بينهم بأي وقت. صفحة "الدفعات الشهرية"
     مشتركة للقسمين (تحويل واحد لكل صيدلي).
   - دخول الأدمن (أي نوع) بيصير باسم مستخدم (username) مش رقم هاتف،
     فبنميّزه تلقائيًا: أي إدخال مش 10 أرقام بالضبط يعتبر محاولة
     دخول أدمن.
   - ميزة "نسيت كلمة المرور" بالنموذج الأصلي كانت بترجع كلمة المرور
     مباشرة (تجريبي فقط) — الباك-إند الحقيقي ما بيدعم هيك شي (ولا يجب
     إنه يدعمه أصلاً لأسباب أمنية)، فحولناها لشاشة إرشادية فقط.
   ========================================================= */

/* ---------------- إعدادات ---------------- */
const API_BASE = (window.MOSTODAA_API_BASE || 'https://mostodaa-backend-3d1m.onrender.com/api');

const JORDAN_CITIES = ['عمّان','إربد','الزرقاء','البلقاء (السلط)','المفرق','الكرك','معان','الطفيلة','مأدبا','جرش','عجلون','العقبة'];
const DEPARTMENTS = [ { value:'MEDICINE', label:'الأدوية', icon:'💊' }, { value:'COSMETICS', label:'الكوزمتك', icon:'💄' } ];
function deptLabel(dep){ const d = DEPARTMENTS.find(x=>x.value===dep); return d ? d.label : dep; }

/* ---------------- الحالة العامة ---------------- */
let token = localStorage.getItem('mm_token') || null;
let currentUser = null; // من /users/me -> { type:'pharmacist'|'admin', ... }
let CATEGORIES = [];    // أصناف القسم الحالي

/* ---------------- API helper ---------------- */
async function apiRequest(path, { method='GET', json=null, form=null, auth=true } = {}){
  const headers = {};
  if(auth && token) headers['Authorization'] = 'Bearer ' + token;
  let body;
  if(form){ body = form; }
  else if(json){ headers['Content-Type'] = 'application/json'; body = JSON.stringify(json); }

  let res;
  try{
    res = await fetch(API_BASE + path, { method, headers, body });
  }catch(e){
    showConnBanner(true);
    throw new Error('تعذر الاتصال بالسيرفر. تأكد من تشغيل الباك-إند وصحة عنوان API_BASE.');
  }
  showConnBanner(false);

  let data = {};
  try{ data = await res.json(); }catch(e){ /* رد بدون JSON */ }

  if(!res.ok){
    let msg = data && data.message ? data.message : ('حدث خطأ (كود ' + res.status + ')');
    if(data && Array.isArray(data.details) && data.details.length){
      msg = data.details.map(d => d.message).join(' — ');
    }
    const err = new Error(msg);
    err.details = data && data.details;
    err.code = data && data.code;
    err.status = res.status;
    if(res.status === 401 && auth && token){ handleUnauthorized(); }
    throw err;
  }
  return data; // { success, message, data }
}

function showConnBanner(show){
  const el = document.getElementById('connBanner');
  if(!el) return;
  if(show){
    el.textContent = 'تعذر الاتصال بسيرفر الباك-إند (' + API_BASE + ') — تأكد إنه شغّال';
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function handleUnauthorized(){
  token = null; currentUser = null;
  localStorage.removeItem('mm_token');
  currentScreen = 'login';
  toast('انتهت صلاحية الجلسة، الرجاء تسجيل الدخول مجددًا', 'danger');
  render();
}

/* ---------------- utils ---------------- */
function toast(msg, kind){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='danger' ? ' danger' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}
function esc(value){
  if(value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function fmtMoney(n){ return Number(n||0).toFixed(3); }
function fmtMonth(key){
  if(!key) return '';
  const [y,m] = key.split('-').map(Number);
  const names = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
  return names[m-1] + ' ' + y;
}
function currentMonthKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function shiftMonthKey(key, delta){
  const [y,m] = key.split('-').map(Number);
  const idx = y*12 + (m-1) + delta;
  return Math.floor(idx/12)+'-'+String((idx%12)+1).padStart(2,'0');
}
function fmtDate(d){
  if(!d) return '';
  try{
    const dt = d.length===10 ? new Date(d+'T00:00:00') : new Date(d);
    return dt.toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'});
  }catch(e){ return d; }
}
function toDateInputValue(d){
  if(!d) return '';
  return String(d).slice(0,10);
}
function statusBadgeHtml(s){
  return s.status==='APPROVED' ? `<span class="badge ok">مقبولة</span>`
    : s.status==='REJECTED' ? `<span class="badge rejected">مرفوضة</span>`
    : `<span class="badge pending">قيد المراجعة</span>`;
}

function resizeImageToBlob(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1000;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width*scale));
        canvas.height = Math.max(1, Math.round(img.height*scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(blob=>{
          if(!blob){ reject(new Error('تعذرت معالجة الصورة')); return; }
          resolve({ blob, dataUrl: canvas.toDataURL('image/jpeg', 0.8) });
        }, 'image/jpeg', 0.8);
      };
      img.onerror = () => reject(new Error('تعذرت قراءة الصورة'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('تعذرت قراءة الصورة'));
    reader.readAsDataURL(file);
  });
}

async function forgotSendOtp(isResend){
  const phone = isResend ? forgot.phone : document.getElementById('forgotPhone').value.trim();
  if(!/^\d{10}$/.test(phone)){ toast('رقم الهاتف يجب أن يتكون من 10 أرقام', 'danger'); return; }
  const btn = document.getElementById('forgotSendBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جارِ الإرسال...'; }
  try{
    const res = await apiRequest('/auth/pharmacist/forgot-password/send-otp', { method:'POST', auth:false, json:{ phoneNumber: phone } });
    forgot.phone = phone;
    forgot.devCode = res.data && res.data.devOtpCode ? res.data.devOtpCode : null;
    forgot.step = 2;
    toast('تم إرسال رمز التحقق إلى ' + phone);
    render();
  }catch(e){
    if(e.code === 'ACCOUNT_NOT_FOUND'){
      toast(e.message, 'danger');
    } else {
      toast(e.message, 'danger');
    }
    if(btn){ btn.disabled = false; btn.textContent = 'إرسال رمز التحقق'; }
  }
}

async function sendOtp(){
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  if(!name){ toast('الرجاء إدخال الاسم', 'danger'); return; }
  if(!/^\d{10}$/.test(phone)){ toast('رقم الهاتف يجب أن يتكون من 10 أرقام', 'danger'); return; }

  const btn = document.getElementById('sendOtpBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جارِ الإرسال...'; }
  try{
    const res = await apiRequest('/auth/pharmacist/send-otp', { method:'POST', auth:false, json:{ fullName:name, phoneNumber:phone } });
    pendingReg.name = name;
    pendingReg.phone = phone;
    otpCode = res.data && res.data.devOtpCode ? res.data.devOtpCode : null;
    otpVerified = false;
    regPhoneExists = false;
    otpSent = true;
    toast('تم إرسال رمز التحقق إلى ' + phone);
    render();
  }catch(e){

      pendingReg.name = name; pendingReg.phone = phone;
      regPhoneExists = true; otpSent = false; otpCode = null;
      render();
      return;
    }
    toast(e.message, 'danger');
    if(btn){ btn.disabled = false; btn.textContent = 'إرسال رمز التحقق'; }
  }
}

async function doLogin(){
  const idValue = document.getElementById('loginPhone').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!pass){ toast('الرجاء إدخال كلمة المرور', 'danger'); return; }

  const looksNumeric = /^\d+$/.test(idValue);
  if(looksNumeric && idValue.length !== 10){
    toast('رقم الهاتف يجب أن يتكون من 10 أرقام', 'danger');
    return;
  }
  const isAdminAttempt = !(looksNumeric && idValue.length === 10);
  if(isAdminAttempt && idValue.length < 2){
    toast('الرجاء إدخال رقم الهاتف أو اسم المستخدم', 'danger');
    return;
  }

  const btn = document.getElementById('loginBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جارِ الدخول...'; }
  try{
    const res = isAdminAttempt
      ? await apiRequest('/auth/admin/login', { method:'POST', auth:false, json:{ username: idValue, password: pass } })
      : await apiRequest('/auth/pharmacist/login', { method:'POST', auth:false, json:{ phoneNumber: idValue, password: pass } });
    if(res.data && res.data.requires2fa){
      admin2fa = { challengeToken: res.data.challengeToken, maskedPhone: res.data.maskedPhone || '', devCode: res.data.devOtpCode || null };
      goto('twofa');
      return;
    }
    await afterAuthSuccess(res.data.token);
  }catch(e){
    toast(e.message, 'danger');
    if(btn){ btn.disabled = false; btn.textContent = 'دخول'; }
  }
}

async function afterAuthSuccess(newToken){
  token = newToken;
  localStorage.setItem('mm_token', token);
  await loadMe();
  clearAllCaches();
  resetAddFlow();
  toast('مرحبًا ' + currentUser.fullName + ' 👋');
  if(currentUser.type === 'admin'){
    adminPanelChosen = false; adminDeptFilter = '';
    activeTab = 'admin';
    render();
  } else {
    render();
  }
}

async function switchTab(tab){
  activeTab = tab;
  if(tab==='admin'){ adminPharmacistFilter = null; }
  if(tab==='payouts'){ confirmingPayoutId = null; }
  if(tab==='account'){ accountMsg = null; }
  if(tab==='add'){ resetAddFlow(); }
  if(tab==='payoutInfo'){ payoutDraft = null; payoutOtpSent = false; payoutOtpDev = null; payoutEditUnlocked = false; payoutEditOtpSent = false; payoutEditOtpDev = null; payoutEditCode = ''; }
  if(tab==='payouts'){ confirmingPayoutId = null; }
  if(tab==='users'){ catMgmtSubTab = 'NORMAL'; }
  if(tab==='history'){
    historyFilterType = selectedDepartment==='MEDICINE' ? 'NORMAL' : null;
    showFreeItemsSummary = false;
  }
  render();
  await loadTabData(tab);
}

async function loadTabData(tab){
  try{
    if(tab==='add'){
      if(selectedDepartment==='COSMETICS' && (saleMode==='ASIL' || saleMode==='ZAROZA')){
        if(!compensationItemsCache[saleMode]){ await loadCompensationItems(saleMode); render(); }
      } else {
        await loadCategories(); render();
      }
    }
    if(tab==='history'){ await loadMySales(); render(); }
    if(tab==='payoutInfo'){ await loadMySales(); render(); }
    if(tab==='earnings'){ await loadMySales(); render(); }
    if(tab==='previousDues'){ await loadPreviousDues(); render(); }
    if(tab==='referral'){ await loadReferralSummary(); render(); }
    if(tab==='admin'){ await loadAdminSales(); render(); }
    if(tab==='users'){ await loadCategories(); render(); }
    if(tab==='stats'){ await loadPharmacists(); render(); }
    if(tab==='payouts'){ await loadPayouts(); render(); }
    if(tab==='payoutsHistory'){ await loadPayoutsHistory(); render(); }
    if(tab==='reports' && !pharmacistsCache){ await loadPharmacists(); render(); }
    if((tab==='compReportsAsil' || tab==='compReportsZaroza') && !pharmacistsCache){ await loadPharmacists(); render(); }
  }catch(e){ toast(e.message, 'danger'); }
}

async function loadMySales(){
  const res = await apiRequest('/sales?pageSize=200');
  mySalesCache = res.data.items;
}
async function loadReferralSummary(){
  const res = await apiRequest('/referral/me');
  referralSummaryCache = res.data;
}
async function loadAdminSales(){
  const qs = adminPharmacistFilter
    ? ('&pharmacistId=' + adminPharmacistFilter)
    : (currentDepartmentParam() ? ('&department=' + currentDepartmentParam()) : '');
  const res = await apiRequest('/sales?pageSize=300' + qs);
  adminSalesCache = res.data.items;
}
async function loadPharmacists(){
  const res = await apiRequest('/users/pharmacists');
  pharmacistsCache = res.data;
}
async function loadPreviousDues(){
  const res = await apiRequest('/payouts/me');
  previousDuesCache = res.data.rows;
}
async function loadPayouts(){
  const res = await apiRequest('/payouts?scope=' + payoutsScope);
  payoutsData = res.data;
}
async function loadPayoutsHistory(){
  const params = new URLSearchParams();
  if(payoutsHistoryFilterActive){
    if(payoutsHistoryFilter.city) params.set('city', payoutsHistoryFilter.city);
    if(payoutsHistoryFilter.search) params.set('search', payoutsHistoryFilter.search);
  }
  const qs = params.toString() ? ('?' + params.toString()) : '';
  const res = await apiRequest('/payouts/history' + qs);
  payoutsHistoryData = res.data;
}

function pickMainItem(id){
  addFlow.mainItemId = id; addFlow.freeItemId=null; addFlow.date=null;
  pendingInvoiceFile=null; pendingInvoicePreview=null;
  render();
}

function pickFreeItem(id){
  const items = compensationItemsCache[saleMode] || [];
  const mainItem = items.find(c=>c.id===addFlow.mainItemId);
  const freeItem = items.find(c=>c.id===id);
  if(!mainItem || !freeItem) return;
  if(Number(freeItem.price) > Number(mainItem.price)){
    toast('يجب أن يكون سعر الفري أقل من أو يساوي سعر الأصلي', 'danger');
    render();
    return;
  }
  addFlow.freeItemId = id;
  if(!addFlow.date) addFlow.date = toLocalDateStr(new Date());
  pendingInvoiceFile=null; pendingInvoicePreview=null;
  render();
}

function invoiceDateBounds(){
  const now = new Date();
  const min = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 60);
  return { min: toLocalDateStr(min), max: toLocalDateStr(now) };
}
function canSubmitInvoice(){
  return !!(pendingInvoiceFile && addFlow.date);
}
function updateFinalBtn(){
  const btn = document.getElementById('finalSaveBtn');
  if(btn) btn.disabled = !canSubmitInvoice();
}
function onInvoiceNumberInput(el){ addFlow.invoiceNumber = el.value; updateFinalBtn(); }

function renderInvoiceStep(stepNum, submitLabel, isCompensation){
  const b = invoiceDateBounds();
  const dateBlock = addFlow.dateEditing ? `
    <div class="row2" style="margin-bottom:12px;">
      <input type="date" id="dateInput" value="${esc(addFlow.date||b.max)}" min="${b.min}" max="${b.max}">
      <button class="btn sm" style="flex:0 0 auto;" onclick="saveDate()">حفظ</button>
    </div>` : `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13.5px;color:var(--ink-soft);">
      <span>تاريخ الفاتورة: <b style="color:var(--ink);">${fmtDate(addFlow.date)}</b></span>
      <button type="button" onclick="toggleDateEdit()" style="border:none;background:none;color:var(--primary);cursor:pointer;font-size:13.5px;font-weight:700;text-decoration:underline;padding:0;">(تغيير التاريخ)</button>
    </div>`;

  const noteHtml = isCompensation
    ? `⚠️ بعد الإرسال ما بتقدر تعدّل العملية أو تحذفها، تأكد من الصورة والتاريخ.`
    : `⚠️ بعد الإرسال ما بتقدر تعدّل العملية أو تحذفها، تأكد من الصورة والكمية والتاريخ.`;

  return `
  <div class="step-block">
    <div class="step-label"><span class="step-num">${stepNum}</span> بيانات الفاتورة</div>
    ${dateBlock}
    <div class="row2" style="margin-bottom:10px;">
      <button type="button" class="btn sm" style="flex:1;" onclick="document.getElementById('invoiceFileCamera').click()">📷 التقط صورة</button>
      <button type="button" class="btn sm ghost" style="flex:1;" onclick="document.getElementById('invoiceFileGallery').click()">🖼️ من المكتبة</button>
    </div>
    <input type="file" id="invoiceFileCamera" accept="image/*" capture="environment" style="display:none" onchange="handleInvoiceFile(this)">
    <input type="file" id="invoiceFileGallery" accept="image/*" style="display:none" onchange="handleInvoiceFile(this)">
    ${pendingInvoicePreview ? `
    <div class="file-drop">
      <img id="invoicePreview" class="preview-img" src="${pendingInvoicePreview}" style="display:block">
    </div>` : ''}
    <div style="font-size:12px;color:var(--ink-soft);line-height:1.7;margin-top:10px;">
      ${noteHtml}
    </div>
    <button class="btn" id="finalSaveBtn" style="margin-top:12px;" ${canSubmitInvoice()?'':'disabled'} onclick="saveInvoiceAndFinish()">${submitLabel}</button>
  </div>`;
}

function toggleDateEdit(){ addFlow.dateEditing = true; render(); }

function pickCategory(id){ addFlow.categoryId = id; addFlow.qty=null; addFlow.date=null; addFlow.dateEditing=false; pendingInvoiceFile=null; pendingInvoicePreview=null; render(); }

function saveQty(){
  const v = parseInt(document.getElementById('qtyInput').value, 10);
  if(!v || v < 1){ toast('الرجاء إدخال عدد قطع صحيح', 'danger'); return; }
  addFlow.qty = v;
  if(!addFlow.date) addFlow.date = toLocalDateStr(new Date());
  render();
}

function saveDate(){
  const v = document.getElementById('dateInput').value;
  if(!v){ toast('الرجاء اختيار تاريخ البيع', 'danger'); return; }
  addFlow.date = v; addFlow.dateEditing = false;
  render();
}

async function handleInvoiceFile(input){
  const file = input.files[0];
  if(!file) return;
  try{
    const { blob, dataUrl } = await resizeImageToBlob(file);
    pendingInvoiceFile = new File([blob], 'invoice.jpg', { type:'image/jpeg' });
    pendingInvoicePreview = dataUrl;
    const prev = document.getElementById('invoicePreview');
    if(prev){ prev.src = dataUrl; prev.style.display = 'block'; }
    updateFinalBtn();
  }catch(e){
    toast(e.message, 'danger');
  }
}

async function saveInvoiceAndFinish(){
  if(!pendingInvoiceFile){ toast('الرجاء إرفاق صورة الفاتورة', 'danger'); return; }

  const isCompensation = selectedDepartment==='COSMETICS' && (saleMode==='ASIL' || saleMode==='ZAROZA');
  const invNo = '';

  const btn = document.getElementById('finalSaveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جارِ الإرسال...'; }
  try{
    const fd = new FormData();
    if(isCompensation){
      fd.append('saleType', saleMode);
      fd.append('compensationItemId', addFlow.mainItemId);
      fd.append('freeCompensationItemId', addFlow.freeItemId);
    } else {
      fd.append('saleType', 'NORMAL');
      fd.append('categoryId', addFlow.categoryId);
      fd.append('quantity', addFlow.qty);
    }
    fd.append('saleDate', addFlow.date);
    fd.append('invoiceNumber', invNo);
    fd.append('invoiceImage', pendingInvoiceFile);

    const res = await apiRequest('/sales', { method:'POST', form: fd });
    lastSubmittedSale = res.data;
    pendingInvoiceFile = null; pendingInvoicePreview = null;
    mySalesCache = null;
    render();
  }catch(e){
    toast(e.message, 'danger');
    const defaultLabel = isCompensation ? 'إرسال طلب التعويض' : 'حفظ وتسجيل العمولة';
    if(btn){ btn.disabled = false; btn.textContent = defaultLabel; }
  }
}

function finalizeSale(){
  resetAddFlow();
  render();
}

function saleItemLabel(s){
  const type = s.saleType || 'NORMAL';
  if(type === 'ASIL' || type === 'ZAROZA'){
    const mainName = s.compensationItem ? esc(s.compensationItem.name) : '—';
    const freeName = s.freeCompensationItem ? esc(s.freeCompensationItem.name) : '—';
    return `${mainName} <span style="color:var(--ink-soft);font-weight:500;">(فري: ${freeName})</span>`;
  }
  return s.category ? esc(s.category.name) : '';
}

/* -------------------- تبويب: السجل -------------------- */
function tabHistory(){
  if(mySalesCache===null){
    return `<div class="section-title">سجل المبيعات</div><p style="color:var(--ink-soft);">جارِ التحميل...</p>`;
  }

  if(!historyFilterType){
    return `
    <div class="section-title">سجل المبيعات</div>
    <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 22px;">اختر نوع الفواتير اللي بدك تعرضها</p>
    ${historyFiltersForCurrentDept().map(f=>`
      <button class="btn ${f.value==='NORMAL'?'':'accent'}" style="margin-bottom:12px;font-size:15.5px;padding:16px;" onclick="pickHistoryFilter('${f.value}')">
        ${f.icon} ${f.label}
      </button>`).join('')}
    `;
  }

  const mySales = mySalesCache.filter(s =>
    (s.saleType || 'NORMAL') === historyFilterType &&
    (historyFilterType!=='NORMAL' || s.department===selectedDepartment)
  );
  const isComp = historyFilterType==='ASIL' || historyFilterType==='ZAROZA';
  const approvedCount = mySales.filter(s=>s.status==='APPROVED').length;

function freeItemsSummaryHtml(mySales){
  const approved = mySales.filter(s=>s.status==='APPROVED');
  const counts = {};
  approved.forEach(s=>{
    const name = s.freeCompensationItem ? s.freeCompensationItem.name : 'غير محدد';
    counts[name] = (counts[name]||0) + 1;
  });
  const entries = Object.entries(counts);
  if(entries.length===0){
    return `
    <div class="ticket" style="margin-bottom:16px;">
      <div style="text-align:center;color:var(--ink-soft);font-size:13px;padding:6px 0;">ما في قطع فري مستحقة بعد — بتظهر هون أول ما تنعتمد أول فاتورة</div>
    </div>`;

  return `
  <div class="ticket" style="margin-bottom:16px;">
    <div style="font-weight:800;margin-bottom:10px;">🎁 القطع الفري المستحقة (من الفواتير المؤكدة)</div>
    ${entries.map(([name,count])=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);">
        <span>${esc(name)}</span><b class="num">× ${count}</b>
      </div>`).join('')}
    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;font-weight:800;">
      <span>الإجمالي</span><span class="num">${total} قطعة</span>

/* -------------------- تبويب: الدفع -------------------- */
function computeMyPayoutSummary(){
  const mySales = mySalesCache || [];
  const approved = mySales.filter(s=>s.status==='APPROVED');
  const pending = approved.filter(s=>!s.paid).reduce((a,s)=>a+Number(s.commissionAmount),0);
  const transferredSales = approved.filter(s=>s.paid);
  const transferred = transferredSales.reduce((a,s)=>a+Number(s.commissionAmount),0);
  const lastTransfer = transferredSales.sort((a,b)=> new Date(b.paidAt)-new Date(a.paidAt))[0];
  return { pending, transferred, lastTransferAt: lastTransfer ? lastTransfer.paidAt : null, hasAnySale: mySales.length>0 };
}

function ackPayoutIntro(){
  payoutIntroAcked = true;

}

async function startPayoutEdit(){
  try{
    const r = await apiRequest('/users/me/payout/send-otp', { method:'POST' });
    payoutEditOtpSent = true;
    payoutEditOtpDev = r.data && r.data.devOtpCode ? r.data.devOtpCode : null;
    toast('تم إرسال رمز التحقق إلى هاتفك');
    render();
  }catch(e){ toast(e.message, 'danger'); }
}

function verifyPayoutEditOtp(){
  const el = document.getElementById('payoutEditOtpInput');
  const code = el ? el.value.trim() : '';
  if(!/^\d{6}$/.test(code)){ toast('رمز التحقق مكوّن من 6 أرقام', 'danger'); return; }
  payoutEditCode = code;
  payoutEditUnlocked = true;
  payoutDraft = { type: currentUser.payoutType || '', value: currentUser.payoutValue || '' };
  render();
}

function cancelPayoutEdit(){
  payoutDraft = null;
  payoutEditUnlocked = false; payoutEditOtpSent = false; payoutEditOtpDev = null; payoutEditCode = '';
  render();
}

// حد "مرة وحدة باليوم" — هذا تخزين محلي بالمتصفح فقط، يعني ممكن يلتف عليه لو مسح بيانات
// المتصفح أو استخدم جهاز/متصفح تاني. للحماية الحقيقية لازم نفس الحد يُطبّق من السيرفر أيضًا.
function checkPayoutEditedToday(){
  try{
    return localStorage.getItem('mm_payout_last_edit_date') === toLocalDateStr(new Date());
  }catch(e){ return false; }
}
function markPayoutEditedToday(){
  try{ localStorage.setItem('mm_payout_last_edit_date', toLocalDateStr(new Date())); }catch(e){}
}

function onPayoutTypeChange(v){
  payoutDraft = { type: v, value: (v === currentUser.payoutType ? (currentUser.payoutValue||'') : '') };
  render();
}
function onPayoutValueInput(v){
  if(!payoutDraft) payoutDraft = { type: currentUser.payoutType||'', value:'' };
  payoutDraft.value = v;
}

async function savePayoutInfo(){
  const type = payoutDraft ? payoutDraft.type : '';
  if(!type){ toast('الرجاء اختيار نوع الاستلام', 'danger'); return; }
  const valueEl = document.getElementById('payoutValue');
  const value = valueEl ? valueEl.value.trim() : '';
  if(!value){ toast('الرجاء إدخال ' + (type==='PHONE' ? 'رقم الهاتف' : 'الاسم المستعار'), 'danger'); return; }
  if(type==='PHONE' && !/^\d{10}$/.test(value)){ toast('رقم الهاتف يجب أن يتكون من 10 أرقام', 'danger'); return; }
  payoutDraft.value = value;

  const btn = document.getElementById('savePayoutBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جارِ الحفظ...'; }
  try{
    const body = { payoutType:type, payoutValue:value };
    if(payoutEditCode){ body.code = payoutEditCode; }
    const res = await apiRequest('/users/me/payout', { method:'PATCH', json:body });
    currentUser.payoutType = res.data.payoutType;
    currentUser.payoutValue = res.data.payoutValue;
    const wasLockedEdit = !!payoutEditCode;
    payoutDraft = null;
    payoutEditUnlocked = false; payoutEditOtpSent = false; payoutEditOtpDev = null; payoutEditCode = '';
    if(wasLockedEdit) markPayoutEditedToday();
    toast('تم حفظ بيانات الاستلام بنجاح');
    render();
  }catch(e){
    toast(e.message, 'danger');
    if(btn){ btn.disabled = false; btn.textContent = 'حفظ'; render(); }
  }
}

function renderReviewQueue(){

    ${pendingSales.map(s=>{

      const isRejecting = rejectingId === s.id;
      const isComp = s.saleType==='ASIL' || s.saleType==='ZAROZA';
      return `
      <div class="review-card">
        <div class="review-top">

            ${isComp ? `
            <div class="m" style="margin-top:5px;">القطعة المباعة : <b style="color:var(--ink);">${s.compensationItem ? esc(s.compensationItem.name) : '—'}</b></div>
            <div class="m">قطعة التعويض : <b style="color:var(--ink);">${s.freeCompensationItem ? esc(s.freeCompensationItem.name) : '—'}</b></div>

            ` : `
            <div class="n" style="margin-top:2px;">${saleItemLabel(s)}</div>
            <div class="m">${s.quantity} قطعة · ${fmtDate(s.saleDate)}<br>عمولة متوقعة: <b class="num">${fmtMoney(s.commissionAmount)} د.أ</b></div>

        ${s.duplicateImageCount > 0 ? `<div class="dup-warning">⚠️ نفس صورة الفاتورة مستخدمة في ${s.duplicateImageCount} عملية أخرى — تأكد إنها مش نفس الفاتورة مكررة</div>` : ''}
        ${s.invoiceNumberSharedWithOthers ? `<div class="dup-warning">⚠️ رقم الفاتورة هذا مستخدم من صيدلي آخر — الرجاء التدقيق</div>` : ''}
        ${isRejecting ? `
        <div class="field" style="margin-top:10px;margin-bottom:0;">

async function approveSale(id){
  try{
    await apiRequest('/sales/' + id + '/review', { method:'PATCH', json:{ status:'APPROVED' } });
    toast('تم قبول العملية وتأكيد العمولة');
    await loadAdminSales();
    render();
  }catch(e){ toast(e.message, 'danger'); }
}
function startReject(id){ rejectingId = id; render(); }
function cancelReject(){ rejectingId = null; render(); }
async function confirmRejectSale(id){
  const ta = document.getElementById('rejectReason_'+id);
  const reason = ta ? ta.value.trim() : '';
  if(!reason){ toast('الرجاء كتابة سبب الرفض', 'danger'); return; }
  if(reason.length < 3){ toast('سبب الرفض يجب أن يكون 3 أحرف على الأقل', 'danger'); return; }
  try{
    await apiRequest('/sales/' + id + '/review', { method:'PATCH', json:{ status:'REJECTED', rejectionReason: reason } });
    rejectingId = null;
    toast('تم رفض العملية');
    await loadAdminSales();
    render();
  }catch(e){ toast(e.message, 'danger'); }
}

  adminSalesCache = null;
  render();

function toggleNewCatTier(){ newCatTierEnabled = !newCatTierEnabled; render(); }

function startEditCategory(id){
  editingCategoryId = id;
  const c = CATEGORIES.find(x=>x.id===id);
  editCatTierEnabled[id] = !!(c && c.tierEnabled);
  render();
}
function cancelEditCategory(){
  editingCategoryId = null;
  render();
}
function toggleEditCatTier(id){
  editCatTierEnabled[id] = !editCatTierEnabled[id];
  render();
}

async function saveEditCategory(id){
  const name = document.getElementById('editCatName_'+id).value.trim();
  const price = parseFloat(document.getElementById('editCatPrice_'+id).value);
  if(!name){ toast('الرجاء إدخال اسم الصنف', 'danger'); return; }
  if(isNaN(price) || price <= 0){ toast('الرجاء إدخال قيمة عمولة صحيحة', 'danger'); return; }

  let payload = { name, commissionPerUnit: price };
  if(editCatTierEnabled[id]){
    const tCount = parseInt(document.getElementById('editCatTierCount_'+id).value);
    const tPrice = parseFloat(document.getElementById('editCatTierPrice_'+id).value);
    if(isNaN(tCount) || tCount <= 0){ toast('الرجاء إدخال رقم بيعة صحيح لرفع العمولة', 'danger'); return; }
    if(isNaN(tPrice) || tPrice <= 0){ toast('الرجاء إدخال قيمة عمولة جديدة صحيحة', 'danger'); return; }
    payload.tierEnabled = true;
    payload.tierThresholdCount = tCount;
    payload.tierCommissionPerUnit = tPrice;
  } else {
    payload.tierEnabled = false;
  }

  const dep = currentDepartmentParam();
  try{
    await apiRequest('/categories/' + id, { method:'PATCH', json:{ ...payload, ...(dep?{department:dep}:{}) } });
    toast('تم تحديث الصنف بنجاح');
    editingCategoryId = null;
    await loadCategories();
    render();
  }catch(e){ toast(e.message, 'danger'); }
}

async function addCategory(){
  const name = document.getElementById('newCatName').value.trim();
  const price = parseFloat(document.getElementById('newCatPrice').value);
  if(!name){ toast('الرجاء إدخال اسم الصنف', 'danger'); return; }
  if(isNaN(price) || price <= 0){ toast('الرجاء إدخال قيمة عمولة صحيحة', 'danger'); return; }

  let tierPayload = {};
  if(newCatTierEnabled){
    const tCount = parseInt(document.getElementById('newCatTierCount').value);
    const tPrice = parseFloat(document.getElementById('newCatTierPrice').value);
    if(isNaN(tCount) || tCount <= 0){ toast('الرجاء إدخال رقم بيعة صحيح لرفع العمولة', 'danger'); return; }
    if(isNaN(tPrice) || tPrice <= 0){ toast('الرجاء إدخال قيمة عمولة جديدة صحيحة', 'danger'); return; }
    tierPayload = { tierEnabled:true, tierThresholdCount: tCount, tierCommissionPerUnit: tPrice };
  }

  const dep = currentDepartmentParam();
  try{
    await apiRequest('/categories', { method:'POST', json:{ name, commissionPerUnit: price, ...(dep?{department:dep}:{}), ...tierPayload } });
    toast('تمت إضافة الصنف');
    newCatTierEnabled = false;
    await loadCategories();
    render();
  }catch(e){ toast(e.message, 'danger'); }
}

async function deleteCategory(id){
  const dep = currentDepartmentParam();
  try{
    await apiRequest('/categories/' + id + (dep?('?department='+dep):''), { method:'DELETE' });
    toast('تم إلغاء تفعيل الصنف');
    await loadCategories();
    render();
  }catch(e){ toast(e.message, 'danger'); }

async function reactivateCategory(id){
  const dep = currentDepartmentParam();

async function loadCompensationItemsAdmin(type){

  const qs = '?type=' + type + (dep ? ('&department=' + dep) : '');

  `;
}

async function addCompensationItem(type){
  const name = document.getElementById('newCompItemName_'+type).value.trim();
  const price = parseFloat(document.getElementById('newCompItemPrice_'+type).value);
  if(!name){ toast('الرجاء إدخال اسم الصنف', 'danger'); return; }
  if(isNaN(price) || price <= 0){ toast('الرجاء إدخال سعر صحيح', 'danger'); return; }

  const dep = isSuperAdmin ? adminDeptFilter : currentUser.department;

async function deleteCompensationItem(id, type){
  const isSuperAdmin = currentUser.role === 'SUPER_ADMIN';

async function submitAdminPasswordChange(){
  const cur = document.getElementById('accCurPass').value;
  const n1 = document.getElementById('accNewPass').value;
  const n2 = document.getElementById('accNewPass2').value;
  if(!cur){ toast('أدخل كلمة السر الحالية', 'danger'); return; }
  if(n1.length < 10 || !/[A-Za-z]/.test(n1) || !/[0-9]/.test(n1)){ toast('كلمة السر الجديدة: 10 أحرف على الأقل وفيها حرف إنجليزي ورقم', 'danger'); return; }
  if(n1 !== n2){ toast('كلمتا السر غير متطابقتين', 'danger'); return; }
  const btn = document.getElementById('accSaveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جارِ الحفظ...'; }
  try{
    const res = await apiRequest('/auth/admin/change-password', { method:'POST', json:{ currentPassword: cur, newPassword: n1 } });
    token = res.data.token;
    localStorage.setItem('mm_token', token);
    accountMsg = 'تم تغيير كلمة السر بنجاح ✓';
    toast('تم تغيير كلمة السر بنجاح');
    render();
  }catch(e){
    toast(e.message, 'danger');
    if(btn){ btn.disabled = false; btn.textContent = 'حفظ كلمة السر'; }
  }
}

function toLocalDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function renderPayoutRow(r){
  const alerts = [];
  if(r.pendingCount > 0){
    alerts.push(`<div class="dup-warning" style="margin:0 0 6px;padding:6px 8px;">⚠️ ${r.pendingCount} فاتورة معلّقة <button class="btn sm" style="padding:3px 8px;margin-right:4px;" onclick="reviewPharmacist('${r.pharmacistId}')">مراجعة الفواتير</button></div>`);
  }
  if(r.payoutInfoChangedRecently){
    alerts.push(`<div style="font-size:12px;color:var(--danger);font-weight:700;margin-bottom:4px;">🔔 تغيّرت بيانات الاستلام مؤخرًا — تأكد منها</div>`);
  }
  if(!r.isActive){
    alerts.push(`<div style="font-size:12px;color:var(--danger);">الحساب موقوف</div>`);
  }

  const split = (r.medicineAmount>0 || r.cosmeticsAmount>0)
    ? `<div style="font-size:11.5px;color:var(--ink-soft);font-weight:500;">أدوية ${fmtMoney(r.medicineAmount)} · كوزمتك ${fmtMoney(r.cosmeticsAmount)}</div>` : '';

  const action = r.amount > 0
    ? `<button class="btn approve sm" onclick="startConfirmPayout('${r.pharmacistId}')">✓ تأكيد التحويل</button>`
    : `<span style="color:var(--ink-soft);font-size:12.5px;">لا يوجد مبلغ جاهز</span>`;

  const row = `<tr>
    <td><b>${esc(r.fullName)}</b><div style="font-size:12px;color:var(--ink-soft);">${esc(r.pharmacyName)} · <span class="num">${esc(r.phoneNumber)}</span></div></td>
    <td class="num"><b>${fmtMoney(r.amount)}</b>${split}${r.salesCount ? `<div style="font-size:11.5px;color:var(--ink-soft);font-weight:500;">${r.salesCount} عملية</div>` : ''}</td>
    <td>${r.payoutValue ? `${payoutTypeLabel(r.payoutType)}<div class="num" style="font-weight:700;">${esc(r.payoutValue)}</div>` : `<span style="color:var(--danger);font-size:12.5px;">لم يدخل بيانات الاستلام</span>`}</td>
    <td>${alerts.join('') || '—'}</td>
    <td>${action}</td>
  </tr>`;

  if(confirmingPayoutId !== r.pharmacistId || r.amount<=0) return row;

  const noInfo = !r.payoutValue;
  return row + `<tr><td colspan="5" style="background:var(--accent-tint);">
    <div style="padding:6px 4px;line-height:1.9;">
      <div style="font-weight:800;margin-bottom:6px;">تأكيد التحويل</div>
      <div>الصيدلاني: <b>${esc(r.fullName)}</b> — ${esc(r.pharmacyName)}</div>
      <div>المبلغ المطلوب تحويله: <b class="num" style="font-size:17px;">${fmtMoney(r.amount)} د.أ</b> (${r.salesCount} عملية)</div>
      <div>${payoutTypeLabel(r.payoutType)}: <b class="num">${esc(r.payoutValue || '—')}</b></div>
      ${r.pendingCount>0 ? `<div class="dup-warning" style="margin:8px 0;">⚠️ عند هذا الصيدلي ${r.pendingCount} فاتورة معلّقة لسا ما انراجعت — القيمة هون ما بتشملها.</div>` : ''}
      ${noInfo ? `<div class="dup-warning" style="margin:8px 0;">لا يمكن التأكيد: الصيدلي لم يدخل بيانات استلام المستحقات.</div>` : ''}
      <div class="field" style="margin:8px 0;">
        <label>رقم عملية التحويل (اختياري)</label>
        <input type="text" id="payoutRef_${r.pharmacistId}" maxlength="100" placeholder="رقم العملية من تطبيق البنك">
      </div>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;">حوّل المبلغ من تطبيق البنك أولًا، وبعدها اضغط "نعم، تم التحويل" لتسجيله.</div>
      <div style="display:flex;gap:8px;">
        <button class="btn approve sm" ${noInfo?'disabled':''} onclick="confirmPayout('${r.pharmacistId}')">نعم، تم التحويل</button>
        <button class="btn ghost sm" onclick="cancelConfirmPayout()">إلغاء</button>
      </div>
    </div>
  </td></tr>`;
}

async function setPayoutsScope(scope){
  payoutsScope = scope;
  payoutsData = null; confirmingPayoutId = null;
  render();
  try{ await loadPayouts(); render(); }catch(e){ toast(e.message, 'danger'); }
}
function startConfirmPayout(id){ confirmingPayoutId = id; render(); }
function cancelConfirmPayout(){ confirmingPayoutId = null; render(); }

async function confirmPayout(pharmacistId){
  if(!payoutsData) return;
  const r = payoutsData.rows.find(x=>x.pharmacistId===pharmacistId);
  if(!r) return;
  const refEl = document.getElementById('payoutRef_'+pharmacistId);
  const reference = refEl ? refEl.value.trim() : '';
  try{
    await apiRequest('/payouts/confirm', { method:'POST', json:{
      pharmacistId,
      scope: payoutsScope,
      expectedAmount: Number(r.amount),
      expectedSalesCount: r.salesCount,
      ...(reference ? { reference } : {})
    }});
    toast('تم تسجيل الدفعة بنجاح ✓');
    confirmingPayoutId = null;
    await loadPayouts();
    render();
  }catch(e){
    toast(e.message, 'danger');
    if(e.code === 'AMOUNT_CHANGED'){
      confirmingPayoutId = null;
      try{ await loadPayouts(); render(); }catch(_e){}
    }
  }
}

function exportPayoutsToExcel(){
  if(!payoutsData || payoutsData.rows.length===0){ toast('لا توجد بيانات لتصديرها', 'danger'); return; }
  const data = payoutsData.rows.map(r=>({
    'اسم الصيدلاني': r.fullName,
    'رقم الهاتف': r.phoneNumber,
    'اسم الصيدلية': r.pharmacyName,
    'المبلغ (دينار)': Number(Number(r.amount).toFixed(3)),
    'أدوية': Number(Number(r.medicineAmount).toFixed(3)),
    'كوزمتك': Number(Number(r.cosmeticsAmount).toFixed(3)),
    'عدد العمليات': r.salesCount,
    'نوع الاستلام': payoutTypeLabel(r.payoutType),
    'الاسم المستعار / رقم الهاتف': r.payoutValue || '',
    'فواتير معلّقة': r.pendingCount,
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{wch:20},{wch:14},{wch:22},{wch:14},{wch:12},{wch:12},{wch:12},{wch:14},{wch:24},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الدفعات');
  const label = payoutsScope==='last_month' ? 'الشهر-السابق' : 'الآن';
  XLSX.writeFile(wb, `مستحقات-${label}.xlsx`);
  toast('تم تصدير ملف Excel');
}

async function runRegionFilter(){
  adminFilter.city = document.getElementById('filterCity').value;
  adminFilter.fromDate = document.getElementById('filterFromDate').value;
  adminFilter.toDate = document.getElementById('filterToDate').value;
  const dep = currentDepartmentParam();
  const depQs = dep ? ('&department='+dep) : '';
  try{
    const [salesRes, pharmRes] = await Promise.all([
      apiRequest('/sales?status=APPROVED&saleType=NORMAL&pageSize=500' + depQs),
      apiRequest('/users/pharmacists')
    ]);
    const cityById = {};
    pharmRes.data.forEach(p=>{ cityById[p.id] = p.city; });
    const fromD = adminFilter.fromDate, toD = adminFilter.toDate;
    reportsRows = salesRes.data.items.filter(s=>{
      const saleDay = toDateInputValue(s.saleDate);
      if(saleDay < fromD || saleDay > toD) return false;
      const city = cityById[s.pharmacistId];
      if(adminFilter.city !== '' && city !== adminFilter.city) return false;
      return true;
    }).map(s=> ({...s, _city: cityById[s.pharmacistId] || ''}))
      .sort((a,b)=> a.saleDate===b.saleDate ? new Date(a.createdAt)-new Date(b.createdAt) : String(a.saleDate).localeCompare(String(b.saleDate)));
    adminFilterActive = true;
    render();
  }catch(e){ toast(e.message, 'danger'); }
}

function renderRegionFilterResults(){
  const approvedResults = reportsRows;

  const distinctPharmacies = new Set(approvedResults.map(s=>s.pharmacistId)).size;
  const label = adminFilter.city || 'كل المناطق';

  return `
  <div style="margin-top:16px;">
    <div class="stat-grid">
      <div class="stat-card"><div class="v num">${approvedResults.length}</div><div class="l">عمولة مؤكدة</div></div>
      <div class="stat-card"><div class="v num">${distinctPharmacies}</div><div class="l">صيدلية فعّالة</div></div>
      <div class="stat-card"><div class="v num">${fmtMoney(total)}</div><div class="l">إجمالي العمولات (د.أ)</div></div>
    </div>
    ${approvedResults.length===0 ? `<div class="empty-state"><div class="ic">🔎</div><div class="t">لا توجد عمولات مؤكدة</div><div class="d">في ${label} بين ${fmtDate(adminFilter.fromDate)} و${fmtDate(adminFilter.toDate)}</div></div>` : `
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>#</th><th>الصيدلية</th><th>المنطقة</th><th>الصنف</th><th class="num">القطع</th><th class="num">العمولة (د.أ)</th><th>التاريخ</th><th>الحالة</th><th>الفاتورة</th></tr></thead>
        <tbody>
        ${approvedResults.map((s,i)=>{
          const p = s.pharmacist;
          return `<tr><td class="num">${i+1}</td><td>${esc(p?p.pharmacyName:'')}</td><td>${esc(s._city)}</td><td>${saleItemLabel(s)}</td><td class="num">${s.quantity}</td><td class="num">${fmtMoney(s.commissionAmount)}</td><td>${fmtDate(s.saleDate)}</td><td>${statusBadgeHtml(s)}</td><td>${s.invoiceImageUrl ? `<button class="view-invoice-btn" onclick="openImageModal('${s.invoiceImageUrl}','فاتورة-${s.id}.jpg')">🔍 عرض</button>` : '—'}</td></tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>`}
  </div>`;
}

function saleItemLabelPlain(s){
  const type = s.saleType || 'NORMAL';
  if(type === 'ASIL' || type === 'ZAROZA'){
    const mainName = s.compensationItem ? s.compensationItem.name : '—';
    const freeName = s.freeCompensationItem ? s.freeCompensationItem.name : '—';
    return `${mainName} (فري: ${freeName})`;
  }
  return s.category ? s.category.name : '';
}

/* -------------------- تبويبات: تقارير تعويض الأصيل / زاروزا -------------------- */
function compReportTitle(type){ return type==='ASIL' ? 'تعويض الأصيل' : 'تعويض زاروزا'; }

function tabCompReports(type){
  const f = compReportsFilter[type];
  const pharmacists = (pharmacistsCache||[]).slice().sort((a,b)=> (a.pharmacyName||'').localeCompare(b.pharmacyName||'', 'ar'));
  return `
  <div class="section-title">تقارير ${compReportTitle(type)}</div>
  <div class="admin-section">
    <div class="section-title">فواتير ${compReportTitle(type)} حسب المنطقة/الصيدلية والمدى الزمني</div>
    <div class="field">
      <label>المنطقة</label>
      <select id="compFilterCity_${type}">
        <option value="" ${f.city===''?'selected':''}>كل المناطق</option>
        ${JORDAN_CITIES.map(c=>`<option value="${c}" ${f.city===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>الصيدلية</label>
      <select id="compFilterPharmacist_${type}">
        <option value="" ${f.pharmacistId===''?'selected':''}>كل الصيدليات</option>
        ${pharmacists.map(p=>`<option value="${p.id}" ${f.pharmacistId===p.id?'selected':''}>${esc(p.pharmacyName)}</option>`).join('')}
      </select>
    </div>
    <div class="row2">
      <div class="field">
        <label>من تاريخ</label>
        <input type="date" id="compFilterFromDate_${type}" value="${f.fromDate}">
      </div>
      <div class="field">
        <label>إلى تاريخ</label>
        <input type="date" id="compFilterToDate_${type}" value="${f.toDate}">
      </div>
    </div>
    <button class="btn" onclick="runCompReportFilter('${type}')">عرض التقرير</button>

    ${compReportsActive[type] ? renderCompReportResults(type) : ''}
  </div>
  `;
}

async function runCompReportFilter(type){
  const f = compReportsFilter[type];
  f.city = document.getElementById('compFilterCity_'+type).value;
  f.pharmacistId = document.getElementById('compFilterPharmacist_'+type).value;
  f.fromDate = document.getElementById('compFilterFromDate_'+type).value;
  f.toDate = document.getElementById('compFilterToDate_'+type).value;
  try{
    const [salesRes, pharmRes] = await Promise.all([
      apiRequest('/sales?status=APPROVED&saleType=' + type + '&department=COSMETICS&pageSize=500'),
      pharmacistsCache ? Promise.resolve({data:pharmacistsCache}) : apiRequest('/users/pharmacists')
    ]);
    pharmacistsCache = pharmRes.data;
    const cityById = {};
    pharmacistsCache.forEach(p=>{ cityById[p.id] = p.city; });
    const fromD = f.fromDate, toD = f.toDate;
    compReportsRows[type] = salesRes.data.items.filter(s=>{
      const saleDay = toDateInputValue(s.saleDate);
      if(saleDay < fromD || saleDay > toD) return false;
      const city = cityById[s.pharmacistId];
      if(f.city !== '' && city !== f.city) return false;
      if(f.pharmacistId !== '' && s.pharmacistId !== f.pharmacistId) return false;
      return true;
    }).map(s=> ({...s, _city: cityById[s.pharmacistId] || ''}))
      .sort((a,b)=> a.saleDate===b.saleDate ? new Date(a.createdAt)-new Date(b.createdAt) : String(a.saleDate).localeCompare(String(b.saleDate)));
    compReportsActive[type] = true;
    render();
  }catch(e){ toast(e.message, 'danger'); }
}

function renderCompReportResults(type){
  const rows = compReportsRows[type] || [];
  const f = compReportsFilter[type];
  const distinctPharmacies = new Set(rows.map(s=>s.pharmacistId)).size;
  const label = f.city || 'كل المناطق';

  return `
  <div style="margin-top:16px;">
    <div class="stat-grid">
      <div class="stat-card"><div class="v num">${rows.length}</div><div class="l">فاتورة تعويض مؤكدة</div></div>
      <div class="stat-card"><div class="v num">${distinctPharmacies}</div><div class="l">صيدلية فعّالة</div></div>
    </div>
    ${rows.length===0 ? `<div class="empty-state"><div class="ic">🔎</div><div class="t">لا توجد فواتير مؤكدة</div><div class="d">في ${label} بين ${fmtDate(f.fromDate)} و${fmtDate(f.toDate)}</div></div>` : `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;">
      <button class="export-btn" onclick="exportCompDetailedExcel('${type}')">⬇ تصدير تفصيلي Excel</button>
      <button class="export-btn" onclick="printCompFreeItemsPDF('${type}')">🖨️ تصدير PDF لكل صيدلية</button>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>#</th><th>الصيدلية</th><th>المنطقة</th><th>الصنف الأساسي</th><th>الصنف الفري</th><th>التاريخ</th><th>الحالة</th><th>الفاتورة</th></tr></thead>
        <tbody>
        ${rows.map((s,i)=>{
          const p = s.pharmacist;
          return `<tr><td class="num">${i+1}</td><td>${esc(p?p.pharmacyName:'')}</td><td>${esc(s._city)}</td><td>${s.compensationItem?esc(s.compensationItem.name):''}</td><td>${s.freeCompensationItem?esc(s.freeCompensationItem.name):''}</td><td>${fmtDate(s.saleDate)}</td><td>${statusBadgeHtml(s)}</td><td>${s.invoiceImageUrl ? `<button class="view-invoice-btn" onclick="openImageModal('${s.invoiceImageUrl}','فاتورة-${s.id}.jpg')">🔍 عرض</button>` : '—'}</td></tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>`}
  </div>`;
}

function exportCompDetailedExcel(type){
  const rows = compReportsRows[type] || [];
  if(rows.length===0){ toast('لا توجد فواتير لتصديرها', 'danger'); return; }
  const data = rows.map((s,i)=>{
    const p = s.pharmacist;
    return {
      '#': i+1,
      'اسم الصيدلية': p ? p.pharmacyName : '',
      'صاحب الحساب': p ? p.fullName : '',
      'رقم الهاتف': p ? p.phoneNumber : '',
      'المنطقة': s._city,
      'الصنف الأساسي': s.compensationItem ? s.compensationItem.name : '',
      'الصنف الفري': s.freeCompensationItem ? s.freeCompensationItem.name : '',
      'تاريخ البيع': toDateInputValue(s.saleDate),
      'الحالة': 'مقبولة'
    };
  });
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{wch:5},{wch:22},{wch:18},{wch:14},{wch:16},{wch:22},{wch:22},{wch:14},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, compReportTitle(type));
  XLSX.writeFile(wb, `تفصيلي-${compReportTitle(type)}-${toDateInputValue(new Date())}.xlsx`);
  toast('تم تصدير الملف التفصيلي');
}

function computeFreeItemsByPharmacy(rows){
  const byPharm = {};
  rows.forEach(s=>{
    if(!s.freeCompensationItem) return;
    const pid = s.pharmacistId;
    const pname = s.pharmacist ? s.pharmacist.pharmacyName : 'غير معروف';
    if(!byPharm[pid]) byPharm[pid] = { pharmacyName: pname, items: {}, total: 0 };
    const iname = s.freeCompensationItem.name;
    byPharm[pid].items[iname] = (byPharm[pid].items[iname]||0) + 1;
    byPharm[pid].total += 1;
  });
  return Object.values(byPharm)
    .map(p=>({
      pharmacyName: p.pharmacyName,
      total: p.total,
      items: Object.entries(p.items).map(([name,count])=>({name,count})).sort((a,b)=>a.name.localeCompare(b.name,'ar'))
    }))
    .sort((a,b)=> a.pharmacyName.localeCompare(b.pharmacyName,'ar'));
}

function printCompFreeItemsPDF(type){
  const rows = compReportsRows[type] || [];
  if(rows.length===0){ toast('لا توجد فواتير لتصديرها', 'danger'); return; }
  const byPharmacy = computeFreeItemsByPharmacy(rows);
  if(byPharmacy.length===0){ toast('لا توجد قطع فري لتصديرها', 'danger'); return; }

  const dateLabel = fmtDate(new Date());
  const pagesHtml = byPharmacy.map(p=>`
    <div class="pdf-page">
      <div class="pdf-header">
        <div class="pdf-title">${compReportTitle(type)} — القطع الواجب تعويضها</div>
        <div class="pdf-pharmacy">${esc(p.pharmacyName)}</div>
        <div class="pdf-date">تاريخ التصدير: ${dateLabel}</div>
      </div>
      <table class="pdf-table">
        <thead><tr><th>#</th><th>الصنف (القطعة الفري)</th><th>عدد القطع المستحقة</th></tr></thead>
        <tbody>
          ${p.items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.name)}</td><td>${it.count}</td></tr>`).join('')}
        </tbody>
        <tfoot><tr><td colspan="2">الإجمالي</td><td>${p.total}</td></tr></tfoot>
      </table>
    </div>`).join('');

  const html = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>القطع الواجب تعويضها - ${compReportTitle(type)}</title>
<style>
  body{ font-family:'Segoe UI', Tahoma, Arial, sans-serif; margin:0; padding:0; color:#1a1a1a; }
  .pdf-page{ padding:36px 40px; page-break-after: always; }
  .pdf-page:last-child{ page-break-after: auto; }
  .pdf-header{ margin-bottom:22px; border-bottom:3px solid #1D6F3E; padding-bottom:14px; }
  .pdf-title{ font-size:15px; color:#555; margin-bottom:4px; }
  .pdf-pharmacy{ font-size:26px; font-weight:800; color:#1D6F3E; }
  .pdf-date{ font-size:12px; color:#888; margin-top:6px; }
  .pdf-table{ width:100%; border-collapse:collapse; }
  .pdf-table th, .pdf-table td{ border:1px solid #ddd; padding:10px 12px; text-align:right; font-size:14px; }
  .pdf-table th{ background:#E9F5EF; color:#1D6F3E; font-weight:800; }
  .pdf-table tfoot td{ font-weight:800; background:#F7F7F7; }
  @media print{ .pdf-page{ padding:24px 30px; } }
</style>
</head>
<body onload="window.print()">
${pagesHtml}
</body>
</html>`;

  const w = window.open('', '_blank');
  if(!w){ toast('الرجاء السماح بالنوافذ المنبثقة (Popups) لهذا الموقع', 'danger'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

/* -------------------- تصدير Excel لكل عمليات البيع -------------------- */
function exportSalesToExcel(){
  const sales = adminSalesCache || [];
  if(sales.length===0){ toast('لا توجد عمليات بيع لتصديرها', 'danger'); return; }
  const statusLabel = s => s.status==='APPROVED' ? 'مقبولة' : s.status==='REJECTED' ? 'مرفوضة' : 'قيد المراجعة';
  const rows = [...sales].sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt)).map(s=>{
    const p = s.pharmacist;
    const isComp = s.saleType && s.saleType!=='NORMAL';
    return {
      'اسم الصيدلية': p ? p.pharmacyName : '',
      'صاحب الحساب': p ? p.fullName : '',
      'رقم الهاتف': p ? p.phoneNumber : '',
      'نوع العملية': saleModeLabel(s.saleType || 'NORMAL'),
      'الصنف': saleItemLabelPlain(s),
      'عدد القطع': isComp ? '—' : s.quantity,
      'تاريخ البيع': toDateInputValue(s.saleDate),
      'قيمة العمولة (دينار)': isComp ? '—' : Number(Number(s.commissionAmount).toFixed(3)),
      'الحالة': statusLabel(s),
      'سبب الرفض': s.rejectionReason || ''
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:22},{wch:18},{wch:14},{wch:16},{wch:26},{wch:10},{wch:14},{wch:18},{wch:14},{wch:22}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'عمليات البيع');
  XLSX.writeFile(wb, 'مبيعات-مستودع-مسروجي.xlsx');
  toast('تم تصدير ملف Excel');
}

/* ---------------- init ---------------- */
(async function init(){
  try{
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref');
    if(ref && /^[A-Za-z0-9]{4,12}$/.test(ref.trim())) incomingReferralCode = ref.trim().toUpperCase();
  }catch(e){}

  document.getElementById('app').innerHTML = `<div class="center-wrap"><div style="color:var(--ink-soft);">جارِ التحميل...</div></div>`;
  if(token){
    try{
      await loadMe();
      clearAllCaches();
      if(currentUser.type === 'admin'){
        adminPanelChosen = false; adminDeptFilter = '';
        activeTab = 'admin';
        render();
      } else {
        activeTab = 'add';
        render();
      }
      return;
    }catch(e){
      token = null; currentUser = null;
      localStorage.removeItem('mm_token');
    }
  }
  render();
})();
</script>
