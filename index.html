<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- سياسة أمان المحتوى: تمنع الاتصال بأي سيرفر غير الـ API الخاص بنا (يحدّ من سرقة التوكن لو صار XSS).
     السكربت والتنسيقات بملفات خارجية (js/app.js و css/styles.css) ومعالجات الأحداث عبر data-* بدون أي كود inline،
     فما في داعي نسمح بالكود الـ inline لا بالسكربت ولا بالتنسيق.
     ملاحظة: لو غيّرت عنوان الـ API (دومين مخصص مثلاً) لازم تعدّل connect-src هون وعنوان API_BASE بملف js/app.js. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://mostodaa-backend-3d1m.onrender.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>مستودع مسروجي · نظام العمولات (متصل بالسيرفر)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="toastWrap" class="toast-wrap"></div>
<div id="app"></div>
<div id="connBanner" class="sx-1"></div>

<div id="imgModal" class="img-modal-overlay hidden">
  <div class="img-modal-inner">
    <img id="imgModalImg" class="img-modal-img" src="" alt="صورة الفاتورة">
    <div class="img-modal-actions">
      <a id="imgModalDownload" class="img-modal-download" href="#" download="فاتورة.jpg">⬇ تحميل الصورة</a>
      <button class="img-modal-close" data-click="closeImageModal">✕ إغلاق</button>
    </div>
  </div>
</div>

<div id="compareImgModal" class="img-modal-overlay hidden">
  <div class="img-modal-inner sx-2">
    <div id="compareImgTitle" class="sx-3"></div>
    <div class="sx-4">
      <div class="sx-5">
        <div class="sx-6">الفاتورة الحالية</div>
        <img id="compareImgA" class="sx-7" src="" alt="الفاتورة الحالية">
      </div>
      <div class="sx-5">
        <div class="sx-6">الفاتورة المشابهة</div>
        <img id="compareImgB" class="sx-7" src="" alt="الفاتورة المشابهة">
      </div>
    </div>
    <div class="img-modal-actions">
      <button class="img-modal-close" data-click="closeCompareImageModal">✕ إغلاق</button>
    </div>
  </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
<script src="js/app.js"></script>
</body>
</html>
